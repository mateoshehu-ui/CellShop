<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Karroca — CellShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">CellShop</a>
      <button class="menu-btn" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="index.html">Hyrja</a>
        <a href="products.html">Dyqani</a>
        <a href="cart.html" class="cart-btn active">
          🛒 <span>Karroca</span>
          <span class="cart-badge hidden">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="cart-page">
    <h1>Karroca jote</h1>
    <div id="cartList" class="cart-list"></div>
    <div id="cartSummary" class="cart-summary" style="display:none">
      <div class="cart-summary-row"><span>Nëntotali</span><span id="subtotal">0 €</span></div>
      <div class="cart-summary-row"><span>Transporti <small>(Falas mbi 500 €)</small></span><span id="shipping">0 €</span></div>
      <div class="cart-summary-row"><span>Totali</span><span class="total" id="total">0 €</span></div>
      <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap">
        <a href="products.html" class="btn ghost">← Vazhdo blerjet</a>
        <button id="clearCartBtn" class="btn ghost">Zbraz karrocën</button>
        <button id="checkoutBtn" class="btn" style="flex:1;min-width:200px">Vazhdo te pagesa →</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 CellShop. Të gjitha të drejtat e rezervuara.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
